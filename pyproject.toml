[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ethical-fact-checker"
version = "0.1.0"
description = "An ethical fact-checker engine that prioritises facts over semantics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
fact-checker = "fact_checker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
